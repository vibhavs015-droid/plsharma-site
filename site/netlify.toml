# Netlify deployment config — PRODUCTION host (owner decision, 20 Nov 2026).
#
# History: this file started as a preview-only deploy path (17 Nov). The
# owner then made the sample tier visible on this host (19 Nov) and, on
# 20 Nov, ordered the official launch HERE — site renamed to
# plsharmaandcompany.netlify.app, indexing ON, no preview chrome.
# Netlify is therefore the production host now; Vercel config (if ever
# used) ignores this file and vice versa.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Launch state (T16, owner decisions 20 Nov 2026):
  # - SHOW_SAMPLE_CONTENT removed → sample tier OFF for good: no design
  #   preview banner, no SAMPLE badges, no sample bylines, anywhere.
  #   (Content mode is read at build time; the line above shipped "true"
  #   during the preview rounds — deleting it restores confirmed-only.)
  # - ALLOW_INDEXING = true → removes the noindex meta, robots.txt
  #   disallow-all and the X-Robots-Tag header below. Owner chose
  #   "turn indexing ON now" for the official launch.
  ALLOW_INDEXING = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Security / referrer headers (T16 launch hardening) ──────────────────
# The previous X-Robots-Tag noindex header is gone with ALLOW_INDEXING
# above. What remains is quiet production hygiene: no MIME sniffing, no
# clickjacking, no cross-origin leakage, no device sensors.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# ── Caching (T16 optimization) ──────────────────────────────────────────
# Next's hashed build assets are immutable — a year of edge caching is
# safe and is the single biggest repeat-visit win. Public images change
# rarely: one week + SWR so an image swap shows up within a day.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
