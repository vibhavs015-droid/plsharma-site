# Netlify CLI deployment config — preview deploys only.
#
# Why this exists: the owner asked for a shareable preview link (17 Nov 2026).
# The Netlify CLI was already installed and authenticated on this machine, so a
# CLI preview deploy needs zero new accounts. The PRODUCTION deployment path is
# still Vercel per DEPLOYMENT.md (GitHub import + optional domain). Vercel
# ignores this file; Netlify ignores Vercel config. Both coexist harmlessly.
#
# Deployed as a PREVIEW (netlify deploy --prod=false), never the prod alias,
# until the owner passes the publish gate.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Owner request 19 Nov 2026: render the sample tier on the Netlify
  # preview so the owner reviews with banners + SAMPLE tags visible.
  # SAFE FOR THIS FILE ONLY: Netlify is the PERMANENT preview host
  # (production path = Vercel per DEPLOYMENT.md, which ignores this file),
  # so the flag can never reach the live site. Content mode is read at
  # build time — removing this line + redeploying restores confirmed-only.
  SHOW_SAMPLE_CONTENT = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Indexing guard (T9.4) ──────────────────────────────────────────────
# This file deploys PREVIEW deploys only (netlify deploy --prod=false), so
# it guards the preview host permanently: every response carries
# X-Robots-Tag: noindex, nofollow on top of robots.txt's disallow-all and
# the layout's noindex meta — defence in depth while the site is
# unpublished. Going live means deploying on the real host (Vercel, per
# DEPLOYMENT.md) with ALLOW_INDEXING=true there; the preview stays guarded
# by this file and never inherits the production switch.

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
